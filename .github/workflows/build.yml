name: Build Plugin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and package plugin
        id: build
        uses: oddstr13/jellyfin-plugin-repository-manager@master
        with:
          path: h4ip
          output: ./artifacts

      - name: Generate manifest
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: |
          python3 -m pip install jprm
          mkdir -p release
          jprm repo init release/manifest.json
          jprm repo add --url https://raw.githubusercontent.com/${{ github.repository }}/manifest-release release/manifest.json "${{ steps.build.outputs.artifact }}"

      - name: Publish to manifest-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan manifest-release
          git rm -rf . --quiet || true
          cp -r release/. .
          git add -A
          git commit -m "Update plugin build for ${{ github.sha }}"
          git push -f origin manifest-release