<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>H4ip</title>
</head>
<body>
    <div id="H4ipConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="H4ipConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="BotUrl">Bot URL</label>
                        <input id="BotUrl" name="BotUrl" type="text" is="emby-input" />
                        <div class="fieldDescription">Base URL of the h4bot Discord bot's HTTP endpoint. Scheme-aware, defaults to http:// if not specified.</div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="SharedSecret">Shared Secret</label>
                        <input id="SharedSecret" name="SharedSecret" type="text" is="emby-input" />
                        <div class="fieldDescription">Shared secret the bot expects in the X-H4ip-Secret header.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var H4ipConfig = {
                pluginUniqueId: 'd8785d47-e35e-434c-b8ad-2612e1ca87b7'
            };

            document.querySelector('#H4ipConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(H4ipConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#BotUrl').value = config.BotUrl;
                        document.querySelector('#SharedSecret').value = config.SharedSecret;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#H4ipConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(H4ipConfig.pluginUniqueId).then(function (config) {
                        config.BotUrl = document.querySelector('#BotUrl').value;
                        config.SharedSecret = document.querySelector('#SharedSecret').value;
                        ApiClient.updatePluginConfiguration(H4ipConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
