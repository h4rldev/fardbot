<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>H4ip</title>
</head>
<body>
    <div id="H4ipConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="H4ipConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="BotUrl">Bot URL</label>
                        <input id="BotUrl" name="BotUrl" type="text" is="emby-input" />
                        <div class="fieldDescription">Base URL of the h4bot Discord bot's HTTP endpoint.</div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="SharedSecret">Shared Secret</label>
                        <input id="SharedSecret" name="SharedSecret" type="text" is="emby-input" />
                        <div class="fieldDescription">Shared secret the bot expects in the X-H4ip-Secret header.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>

                <h2>Suggested Artists</h2>
                <div id="suggestionList" class="paperList"></div>
            </div>
        </div>
        <script type="text/javascript">
            var H4ipConfig = {
                pluginUniqueId: 'd8785d47-e35e-434c-b8ad-2612e1ca87b7'
            };

            function loadSuggestions() {
                return ApiClient.fetch({
                    url: ApiClient.getUrl('h4ip/suggestions'),
                    type: 'GET',
                    dataType: 'json'
                });
            }

            function renderSuggestions(items) {
                var list = document.querySelector('#suggestionList');
                list.innerHTML = '';
                if (!items.length) {
                    list.innerHTML = '<p class="sectionDescription">No pending suggestions.</p>';
                    return;
                }
                items.forEach(function (item) {
                    var div = document.createElement('div');
                    div.className = 'listItem listItem-border';

                    var body = document.createElement('span');
                    body.className = 'listItemBody';

                    var name = document.createElement('h3');
                    name.textContent = item.Artist;

                    var meta = document.createElement('div');
                    meta.className = 'secondary';
                    meta.textContent = 'Suggested ' + new Date(item.AddedAt).toLocaleString();

                    body.appendChild(name);
                    body.appendChild(meta);

                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.setAttribute('is', 'emby-button');
                    btn.className = 'button-link';
                    btn.textContent = 'Done';
                    btn.addEventListener('click', function () {
                        ApiClient.fetch({
                            url: ApiClient.getUrl('h4ip/suggestions/' + encodeURIComponent(item.Artist)),
                            type: 'DELETE'
                        }).then(loadSuggestions).then(renderSuggestions);
                    });

                    var skip = document.createElement('button');
                    skip.type = 'button';
                    skip.setAttribute('is', 'emby-button');
                    skip.className = 'button-link';
                    skip.textContent = 'Skip';
                    skip.addEventListener('click', function () {
                        ApiClient.fetch({
                            url: ApiClient.getUrl('h4ip/suggestions/' + encodeURIComponent(item.Artist) + '/skip'),
                            type: 'DELETE'
                        }).then(loadSuggestions).then(renderSuggestions);
                    });

                    div.appendChild(body);
                    div.appendChild(skip);
                    div.appendChild(btn);
                    list.appendChild(div);
                });
            }

            document.querySelector('#H4ipConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(H4ipConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#BotUrl').value = config.BotUrl;
                        document.querySelector('#SharedSecret').value = config.SharedSecret;
                        Dashboard.hideLoadingMsg();
                    });
                    loadSuggestions().then(renderSuggestions);
                });

            document.querySelector('#H4ipConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(H4ipConfig.pluginUniqueId).then(function (config) {
                        config.BotUrl = document.querySelector('#BotUrl').value;
                        config.SharedSecret = document.querySelector('#SharedSecret').value;
                        ApiClient.updatePluginConfiguration(H4ipConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
